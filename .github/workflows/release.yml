name: Release

# Started by hand from the Actions tab, on main. The version is the next calendar version,
# YYYY.M.N with N counting this month's releases, unless an exact one is given.
#
# A tag is not the trigger, it is the result. Everything that can fail runs first: the tests,
# the signed and notarized app, and the notarized DMG. The tag is created and the release
# published only after all of it passes, so a failed run leaves nothing behind. Do not push a
# v* tag by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release, YYYY.M.N (leave empty for the next one)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Ahead of the macOS job so a dispatch from the wrong ref fails in seconds.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatched from main
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "${REF}" != "main" ]; then
            echo "::error::Release must be run on main; this run is on ${REF}."
            exit 1
          fi

  release:
    needs: guard
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags to work out the version, and full history for the build number (the commit count).
          fetch-depth: 0

      # Pinned so a CI build matches a desk build.
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Work out the version
        id: target
        env:
          EXACT: ${{ inputs.version }}
        run: |
          if [ -n "${EXACT}" ]; then
            version="${EXACT#v}"
          else
            month="$(date -u +%Y.%-m)"
            last="$(git tag --list "v${month}.*" --sort=-v:refname | head -1)"
            if [ -z "${last}" ]; then
              version="${month}.1"
            else
              version="${month}.$(( ${last##*.} + 1 ))"
            fi
          fi

          if ! printf '%s' "${version}" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "::error::'${version}' is not a YYYY.M.N version."
            exit 1
          fi
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "::error::v${version} is already tagged."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}" >> "$GITHUB_STEP_SUMMARY"

      - run: swift test --skip testEncodePerformance

      - name: Import the signing certificate and notarization key
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            test -n "${!name}" || { echo "::error::The $name secret is not set. See the README's Releasing section."; exit 1; }
          done

          # A throwaway keychain, made the default so notarytool stores its profile there too.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # The .p12 holds only the certificate and its key. Apple's intermediates complete the
          # chain codesign builds; both generations, since Developer ID certificates come from
          # either.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
          done
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null

          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials gift-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and notarize the app
        run: scripts/build_app.sh --version "${{ steps.target.outputs.version }}" --notarize

      - name: Package and notarize the DMG
        run: scripts/make_dmg.sh "${{ steps.target.outputs.version }}"

      # Everything above this line is a check. The tag is the publish.
      - name: Tag
        env:
          TAG: v${{ steps.target.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "dist/GIFt-${VERSION}.dmg" "dist/GIFt-${VERSION}.dmg.sha256" \
            --title "GIFt ${VERSION}" --generate-notes --verify-tag

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" && -f "${KEYCHAIN}" ]]; then
            security delete-keychain "${KEYCHAIN}"
          fi
