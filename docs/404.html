  <style>
    /* GitHub Pages serves this page at any missing path, so every link and asset is absolute. */

    .empty { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 48px 16px 72px; overflow: hidden; }
    .empty .wrap { display: grid; justify-items: center; text-align: center; }
    .empty h1 { margin: 8px 0 10px; }
    .empty p { color: var(--ink-soft); font-size: 1.15rem; max-width: 30em; margin: 0 auto 28px; }
    .empty .links { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }

    /* The scene: an opened gift box, its lid tossed up, confetti still falling, and a tag. */
    .scene { position: relative; width: 300px; height: 280px; margin-bottom: 12px; -webkit-user-select: none; user-select: none; }

    /* The box from slightly above: a front face, and over it the top of the walls with the empty
       inside showing between them. The ribbon runs down the front and over the back wall. */
    .box {
      position: absolute;
      left: 60px;
      bottom: 10px;
      width: 180px;
      height: 112px;
      border-radius: 0 0 12px 12px;
      background: linear-gradient(180deg, #1c8c8c 0%, #167676 100%);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.14), 0 18px 30px rgba(20, 60, 60, 0.25);
    }
    .box .rim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 24px;
      border-radius: 6px 6px 0 0;
      background: #24a0a0;
    }
    .box .rim::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 7px;
      bottom: 0;
      border-radius: 2px 2px 0 0;
      background: #0b4444;
    }
    .box .rim::after { content: ""; position: absolute; left: 50%; top: 0; width: 26px; height: 7px; margin-left: -13px; background: #ff7a5c; }
    .box .ribbon { position: absolute; left: 50%; top: 0; bottom: 0; width: 26px; margin-left: -13px; background: #ff7a5c; }
    .box .ribbon::after { content: ""; position: absolute; inset: 0 8px; background: rgba(255, 255, 255, 0.18); }

    .lid {
      position: absolute;
      left: 46px;
      top: 26px;
      width: 208px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(180deg, #24a0a0 0%, #1c8c8c 100%);
      box-shadow: 0 10px 18px rgba(20, 60, 60, 0.2);
      transform-origin: 40% 100%;
      animation: lid 2.6s ease-in-out infinite;
    }
    .lid::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 26px; margin-left: -13px; background: #ff7a5c; }
    .bow { position: absolute; left: 50%; top: -30px; width: 0; height: 0; }
    .bow i {
      position: absolute;
      top: 0;
      width: 46px;
      height: 32px;
      border: 9px solid #ff7a5c;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }
    .bow i:first-child { right: 2px; transform: rotate(-24deg); }
    .bow i:last-child { left: 2px; transform: rotate(24deg); }
    .bow b { position: absolute; left: -11px; top: 18px; width: 22px; height: 18px; border-radius: 6px; background: #e25c3e; }

    @keyframes lid {
      0%, 100% { transform: translateY(0) rotate(-14deg); }
      50% { transform: translateY(-12px) rotate(-9deg); }
    }

    .confetti i {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: fall 3.4s linear infinite;
    }
    .confetti i:nth-child(3n) { width: 10px; height: 10px; border-radius: 50%; }
    .confetti i:nth-child(odd) { background: #ff7a5c; }
    .confetti i:nth-child(even) { background: #1c8c8c; }
    .confetti i:nth-child(4n) { background: #eadbbe; }
    .confetti i:nth-child(1) { left: 22%; animation-delay: 0s; }
    .confetti i:nth-child(2) { left: 70%; animation-delay: 0.5s; }
    .confetti i:nth-child(3) { left: 40%; animation-delay: 1.1s; }
    .confetti i:nth-child(4) { left: 84%; animation-delay: 1.6s; }
    .confetti i:nth-child(5) { left: 12%; animation-delay: 2.1s; }
    .confetti i:nth-child(6) { left: 58%; animation-delay: 2.6s; }
    .confetti i:nth-child(7) { left: 30%; animation-delay: 0.8s; }
    .confetti i:nth-child(8) { left: 92%; animation-delay: 2.9s; }

    @keyframes fall {
      0% { opacity: 0; transform: translateY(0) rotate(0); }
      10% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(250px) rotate(540deg); }
    }

    /* A gift tag tied to the box, swinging, addressed to whoever opened it. */
    .note {
      position: absolute;
      right: -6px;
      bottom: 54px;
      transform-origin: 6px 50%;
      animation: note 2s ease-in-out infinite alternate;
      filter: drop-shadow(0 6px 10px rgba(60, 40, 10, 0.2));
    }
    .note span {
      position: relative;
      display: block;
      padding: 10px 16px 10px 30px;
      background: var(--cream);
      color: #1d2827;
      font: 800 0.85rem/1.25 var(--font-display);
      text-align: left;
      clip-path: polygon(16px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 16px 100%, 0 50%);
    }
    .note span::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 50%;
      width: 7px;
      height: 7px;
      margin-top: -3.5px;
      border-radius: 50%;
      background: #c7462a;
    }
    .note em { font-style: normal; color: #b83f25; }
    @keyframes note { from { transform: rotate(-4deg); } to { transform: rotate(7deg); } }

    @media (prefers-reduced-motion: reduce) {
      .lid, .note, .confetti i { animation: none; }
      .confetti { display: none; }
    }
  </style>
</head>
